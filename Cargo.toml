[package]
name = "edgectl"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.101"
# Disable default features to reduce transistive dependencies
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = "4.5.58"
clap_complete = { version = "4.5.65", features = ["unstable-dynamic"] }
dirs = "6.0"
humantime = "2.1"
openssl = { version = "0.10.75", features = ["vendored"] } # vendor openssl to enable static builds
reqwest = { version = "0.13.2", features = ["blocking", "json", "cookies"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tabled = "0.21.0"
toml = "1.1"
urlencoding = "2.1.3"
uuid = { version = "1.21.0", features = [ "v4" ] }
# Pinned: ratatui-core 0.1.1 made the buffer diff width-aware, so ratatui-image's kitty cell
# symbol (a whole image escape sequence, ~1300 columns wide) makes the diff skip the rest of the
# buffer and the describe view keeps showing stale content.
# https://github.com/ratatui/ratatui/issues/2685
# ratatui accepts ratatui-core "0.1.0" as a caret range, so ratatui-core needs pinning directly.
# Unpin both once #2685 is fixed.
ratatui = "=0.30.0"
ratatui-core = "=0.1.0"
rpassword = "7.3"
crossterm = "0.29.0"
serde-saphyr = "0.0.11"
unicode-width = "0.2.0"
gethostname = "1.1.0"
ratatui-image = { version = "10.0", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
